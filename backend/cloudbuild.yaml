steps:
  # Step 1: Build and push the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/hfc-football-dev/the-nest-backend:latest'
      - '-t'
      - 'gcr.io/hfc-football-dev/the-nest-backend:$COMMIT_SHA'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/hfc-football-dev/the-nest-backend'

  # Step 2: Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'the-nest-backend'
      - '--image=gcr.io/hfc-football-dev/the-nest-backend:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/hfc-football-dev/the-nest-backend:latest'
  - 'gcr.io/hfc-football-dev/the-nest-backend:$COMMIT_SHA'

timeout: '1800s'
